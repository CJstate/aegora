server:
  addr: "127.0.0.1:8080"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"

routes:
  - name: "api-service"
    path_prefix: "/api"
    methods:
      - "GET"
      - "POST"
    targets:
      - "http://127.0.0.1:8081"
    strip_prefix: "/api"
    lb: "round_robin"
  - name: "web-service"
    path_prefix: "/"
    targets:
      - "http://127.0.0.1:3000"
    lb: "least_connections"

observability:
  log_level: "info"
  metrics_addr: "127.0.0.1:9090"

rate_limit:
  enabled: true
  limiter: "sliding_window"
  max_requests: 60
  window: "1m"
  key: "ip"

reliability:
  breaker_failure_threshold: 5
  breaker_cooldown: "30s"
  retry_enabled: true
  retry_max_attempts: 3
  retry_initial_delay: "100ms"
