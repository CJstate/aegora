server:
  addr: "127.0.0.1:8080"
  read_timeout: "30s"
  write_timeout: "30s"
  idle_timeout: "60s"

routes:
  - name: "api-service"
    path_prefix: "/api"
    targets:
      - "http://127.0.0.1:8081"
    strip_prefix: "/api"
  - name: "web-service"
    path_prefix: "/"
    targets:
      - "http://127.0.0.1:3000"

observability:
  log_level: "info"
  metrics_addr: "127.0.0.1:9090"
